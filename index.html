<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080907">
  <title>Volcán de Cacao — Coming Soon</title>
  <meta name="description" content="Volcán de Cacao is coming soon. Sign up to hear when we launch.">
  <meta property="og:title" content="Volcán de Cacao — Coming Soon">
  <meta property="og:description" content="Be the first to know. Sign up for our launch.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/logo-clean.jpg" type="image/jpeg">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <img class="landscape" src="assets/hero.webp" alt="" aria-hidden="true">
  <div class="shade" aria-hidden="true"></div>
  <main>
    <div class="brand" aria-label="Volcán de Cacao, Flavors of El Salvador">
      <img src="assets/logo-clean.jpg" alt="Gold volcano and cacao emblem" width="104" height="104">
      <p class="brand-name">VOLCÁN DE CACAO</p>
      <p class="brand-origin">FLAVORS OF EL SALVADOR</p>
    </div>
    <div class="coming-soon">
      <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
      <h1>COMING SOON</h1>
      <p class="invitation">Be the first to know when we launch.</p>
      <form id="signup" action="https://formsubmit.co/info@volcandecacao.com" method="POST">
        <label class="visually-hidden" for="email">Email address</label>
        <div class="signup-row">
          <input type="email" id="email" name="email" placeholder="Your email address" autocomplete="email" inputmode="email" maxlength="254" required aria-describedby="signup-note signup-status">
          <button type="submit">Notify me</button>
        </div>
        <input type="hidden" name="_subject" value="New launch signup — Volcán de Cacao">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_url" value="https://volcan-de-cacao-collection.ricardosuarez247.chatgpt.site/">
        <input type="hidden" name="_next" value="https://volcan-de-cacao-collection.ricardosuarez247.chatgpt.site/thanks.html">
        <input type="hidden" name="message" value="Please notify me when Volcán de Cacao launches.">
        <input type="hidden" name="consent" value="I agree to receive launch updates from Volcán de Cacao. I may unsubscribe by email at any time.">
        <div class="spam-field" aria-hidden="true"><label for="website">Leave this empty</label><input type="text" id="website" name="_honey" tabindex="-1" autocomplete="off"></div>
        <p id="signup-note" class="signup-note">Sign up for launch updates. Unsubscribe by email anytime.</p>
        <p id="signup-status" class="signup-status" role="status" aria-live="polite"></p>
        <button type="submit" class="fallback-submit" data-native="true" hidden>Continue with secure signup</button>
      </form>
      <div class="video-section" aria-label="YouTube">
        <a class="youtube-link" href="https://www.youtube.com/@volcandecacao" target="_blank" rel="noopener noreferrer" aria-label="Volcán de Cacao on YouTube, opens in a new tab">
          <svg viewBox="0 0 28 22" aria-hidden="true"><rect x="1" y="2" width="26" height="18" rx="5"></rect><path d="m11 7 7 4-7 4Z"></path></svg>
          <span>Follow on YouTube</span>
        </a>
      </div>
    </div>
  </main>
  <footer><a href="mailto:info@volcandecacao.com">info@volcandecacao.com</a><small>© 2026 Volcan de Cacao LLC</small></footer>
</body>
</html>
